# 评估门控 CI：改 prompt / 换模型后若评估退化，合并即失败（退出码非零）
#
# job1 static-checks：免密钥、秒级——编译、三份 agent 副本一致性、默认模型不得指向已耗尽额度模型
# job2 llm-gate：真实跑 2 条标准用例 + 1 条对抗用例（约 10 次判官调用）
#
# 首次运行前需在 GitHub 仓库 Settings → Secrets and variables → Actions：
#   - Secrets 添加 DASHSCOPE_API_KEY
#   - （可选）Variables 添加 AGENT_MODEL / JUDGE_MODEL 覆盖默认模型
#     （判官/被测模型免费额度随时会耗尽，403 时改这两个变量即可，无需改代码）

name: eval-gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: py_compile 全部脚本
        run: |
          python -m py_compile langsmith-evaluation/*.py openevals-evaluators/*.py langfuse-observability/*.py
          echo "COMPILE_OK"

      - name: 三份 agent 副本必须 md5 一致
        run: |
          md5sum langsmith-evaluation/hybrid_advisor_langgraph.py \
                 openevals-evaluators/hybrid_advisor_langgraph.py \
                 langfuse-observability/hybrid_advisor_langgraph.py \
            | awk '{print $1}' | sort -u | wc -l | grep -qx 1

      - name: 默认模型不得指向已耗尽额度模型
        run: |
          # 每次模型 403 后把它的名字加入 DEAD_MODELS。
          # 历史教训（重构期发现）：旧实现是逐行 `! grep` 排列，bash -e 豁免 `!`
          # 前缀命令，只有最后一行真正生效——禁用清单形同虚设。现改为显式循环。
          # 注意用具体模型名而非系名前缀（qwen 系里有活模型 omni-flash）。
          DEAD_MODELS=(
            "qwen-flash" "qwen-plus" "qwen3.8-2.4t-a95b" "qwen3.8-max-0902"
            "qwen3.8-omni-flash"
            "deepseek-v4.1-flash-1017" "deepseek-v4-pro-0813"
            "glm-5.3" "deepseek-v4.1-flash" "kimi-k3"
          )
          found=0
          for dead in "${DEAD_MODELS[@]}"; do
            for var in AGENT_MODEL JUDGE_MODEL; do
              if grep -rq "getenv(\"${var}\", \"${dead}\")" --include="*.py" .; then
                echo "::error::默认模型 ${var}=${dead} 已耗尽额度（403），请迁移默认值并把 ${dead} 加入本清单"
                found=1
              fi
            done
          done
          exit $found

      - name: 离线特征测试与规格测试（零额度，秒级）
        run: |
          # 测试 import agent/判官模块，需要 langchain 系包（与 llm-gate 共用清单）
          pip install -r requirements-ci.txt
          python -m pytest tests/ -q

  llm-gate:
    runs-on: ubuntu-latest
    needs: static-checks
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL || 'kimi-k3.1-pro' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'kimi-k3.1-pro' }}
    steps:
      - uses: actions/checkout@v4

      - name: 前置检查 secret 已配置
        run: |
          # 在 shell 里判断（不用 GitHub 表达式：secrets 上下文不能进 if，
          # job 级 env 也进不了步骤级 if 的 env 上下文——两者都踩过）
          if [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::error::未配置 DASHSCOPE_API_KEY secret（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "secret 已配置（长度 ${#DASHSCOPE_API_KEY} 字符）"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装最小依赖
        run: pip install -r requirements-ci.txt

      - name: 运行评估门控（2 标准 + 1 对抗用例）
        working-directory: openevals-evaluators
        run: python -m pytest test_eval_gate.py -v
